<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranger Mode</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 16px; color: #1a1a1a; background: #fff; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .high { color: #b00020; } .medium { color: #a15c00; } .low { color: #1b7f3b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .tile { border: 1px solid #ccc; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; }
  .tile.risk { background: #fde2e4; } .tile.rubric { background: #fff4cc; } .tile.both { background: linear-gradient(135deg, #fde2e4 50%, #fff4cc 50%); }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; } .side pre { white-space: pre-wrap; background: #f6f6f6; padding: 8px; }
  button:disabled { opacity: .5; }
  .finding { padding: 6px 8px; margin: 4px 0; border-radius: 6px; border-left: 4px solid; cursor: pointer; }
  .finding.error { background: #fde2e4; border-color: #b00020; }
  .finding.warning { background: #fff4cc; border-color: #a15c00; }
  .finding.active { outline: 2px solid #333; }
  .page-view { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start; margin-top: 1rem; }
  .canvas-wrap { position: relative; display: inline-block; border: 1px solid #ccc; background: #fff; }
  .canvas-wrap canvas { display: block; }
  .hot { position: absolute; border-radius: 2px; cursor: pointer; outline-offset: -1px; }
  .hot.error { background: rgba(176, 0, 32, .28); outline: 1px solid rgba(176, 0, 32, .7); }
  .hot.warning { background: rgba(161, 92, 0, .28); outline: 1px solid rgba(161, 92, 0, .7); }
  .hot.active { outline-width: 3px; }
</style>
</head>
<body>
<h1>Stranger Mode</h1>
<p>Skeleton UI for testing the pipeline end to end. Replace freely.</p>

<section>
  <h2>1. Upload</h2>
  <input type="file" id="pdf" accept="application/pdf"> <button id="go">Scrub locally</button>
</section>

<section id="gate" hidden>
  <h2>2. Privacy gate</h2>
  <div id="people"></div>
  <button id="accept">Accept all suggestions</button>
  <button id="send" disabled>Send scrubbed text for rubric review</button>
</section>

<section id="heat" hidden>
  <h2>3. Submission heatmap</h2>
  <p><small>Click a page to see where it fails the format. Red = error, amber = warning. Overlapping issues stack into hotter spots.</small></p>
  <div class="grid" id="tiles"></div>
  <div class="page-view">
    <div class="canvas-wrap" id="canvasWrap"><canvas id="pageCanvas"></canvas></div>
    <div id="detail"></div>
  </div>
</section>

<section id="llmview" hidden>
  <h2>What the LLM saw</h2>
  <div id="pages"></div>
</section>

<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";

const $ = (id) => document.getElementById(id);
const api = (path, body) => fetch(path, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
}).then(async (r) => { if (!r.ok) throw new Error((await r.json()).detail); return r.json(); });

// PDF rendering target width in CSS pixels; boxes are scaled from PDF points to match.
const RENDER_WIDTH = 440;
const PT_PER_IN = 72;

let docId, scrubbed, scored, byPage, pdfDoc;

$("go").onclick = async () => {
  const picked = $("pdf").files[0] || null;
  const form = new FormData();
  form.append("file", picked || new Blob(["%PDF-mock"], { type: "application/pdf" }), "doc.pdf");
  const parsed = await fetch("/parse", { method: "POST", body: form }).then((r) => r.json());
  docId = parsed.doc_id;
  // Open the PDF locally so pages can be rendered in the browser. The file never leaves the machine.
  pdfDoc = null;
  if (picked) {
    try { pdfDoc = await pdfjsLib.getDocument({ data: await picked.arrayBuffer() }).promise; }
    catch (e) { console.warn("PDF.js could not open the file; heatmap will draw boxes on a blank page.", e); }
  }
  scrubbed = await api(`/scrub/${docId}`);
  await rescore([]);
  showLlmView();
};

async function rescore(accepted) {
  scored = await api("/score", { doc_id: docId, accepted });
  $("gate").hidden = false;
  $("people").innerHTML = scored.participants.map((p) => `
    <p><b>${p.id}</b>: <span class="${p.risk}">${p.risk} risk (k ≈ ${p.k})</span><br>
    ${Object.entries(p.attributes).map(([k, v]) => `${k}=${v}`).join(", ")}<br>
    ${p.suggestions.map((s) => `→ change "${s.from}" to "${s.to}" (k ≈ ${s.new_k})`).join("<br>")}</p>`).join("");
  $("send").disabled = !scored.gate_open;
}

$("accept").onclick = () => rescore(scored.participants.flatMap((p) =>
  p.suggestions.map((s) => ({ participant_id: p.id, field: s.field }))));

$("send").onclick = async () => {
  const review = await api("/review", { doc_id: docId });
  const riskPages = new Set(scrubbed.participants.flatMap((p) => p.pages).concat(scrubbed.direct_identifiers.map((d) => d.page)));
  byPage = Object.groupBy(review.findings, (f) => f.page);
  const pages = [...new Set([...riskPages, ...Object.keys(byPage).map(Number)])].sort((a, b) => a - b);
  $("heat").hidden = false;
  $("tiles").innerHTML = pages.map((n) => {
    const cls = riskPages.has(n) && byPage[n] ? "both" : riskPages.has(n) ? "risk" : "rubric";
    return `<div class="tile ${cls}" data-page="${n}">p. ${n}</div>`;
  }).join("");
  $("tiles").onclick = (e) => {
    const n = Number(e.target.dataset.page);
    if (n) renderPage(n);
  };
  if (pages.length) renderPage(pages[0]);
};

// Draw one page with PDF.js (local) and overlay a hot spot for each finding's bbox.
async function renderPage(n) {
  const findings = byPage?.[n] || [];
  const wrap = $("canvasWrap");
  const canvas = $("pageCanvas");

  // Scale maps PDF points -> rendered CSS pixels. Default to US Letter for the mock blob.
  let scale, pageWidthPt = 8.5 * PT_PER_IN, pageHeightPt = 11 * PT_PER_IN;
  if (pdfDoc && n <= pdfDoc.numPages) {
    const page = await pdfDoc.getPage(n);
    const base = page.getViewport({ scale: 1 });
    pageWidthPt = base.width; pageHeightPt = base.height;
    scale = RENDER_WIDTH / base.width;
    const viewport = page.getViewport({ scale });
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  } else {
    // No real page image (mock run): draw a blank page at the right aspect so boxes still land.
    scale = RENDER_WIDTH / pageWidthPt;
    canvas.width = pageWidthPt * scale; canvas.height = pageHeightPt * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#eee"; ctx.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
  }

  // Clear old overlays but keep the canvas element.
  wrap.querySelectorAll(".hot").forEach((el) => el.remove());

  // One overlay div per box. A finding can have several boxes (e.g. a quote wrapping across lines).
  findings.forEach((f, i) => {
    (f.bbox || []).forEach((b) => {
      const el = document.createElement("div");
      el.className = `hot ${f.severity}`;
      el.style.left = `${b.x0 * scale}px`;
      el.style.top = `${b.y0 * scale}px`;
      el.style.width = `${(b.x1 - b.x0) * scale}px`;
      el.style.height = `${(b.y1 - b.y0) * scale}px`;
      el.dataset.idx = i;
      el.onclick = () => highlight(i);
      el.title = f.issue;
      wrap.appendChild(el);
    });
  });

  // Side list. Findings with no box (e.g. "no abstract page") show as whole-page badges.
  $("detail").innerHTML = `<h3>Page ${n}</h3>` + (findings.length
    ? findings.map((f, i) =>
        `<div class="finding ${f.severity}" data-idx="${i}">
           <b>[${f.severity}] ${f.issue}</b>
           <br><small>Rubric: ${f.criterion}</small>
           ${f.bbox && f.bbox.length ? "" : "<br><small>(applies to the whole page)</small>"}
         </div>`).join("")
    : "<p>No format findings on this page.</p>");
  $("detail").querySelectorAll(".finding").forEach((el) =>
    el.onclick = () => highlight(Number(el.dataset.idx)));
}

// Clicking a box or its list entry highlights the pair, linking a region to its explanation.
function highlight(idx) {
  $("detail").querySelectorAll(".finding").forEach((el) =>
    el.classList.toggle("active", Number(el.dataset.idx) === idx));
  $("canvasWrap").querySelectorAll(".hot").forEach((el) =>
    el.classList.toggle("active", Number(el.dataset.idx) === idx));
}

async function showLlmView() {
  const view = await fetch(`/llm-view/${docId}`).then((r) => r.json());
  $("llmview").hidden = false;
  $("pages").innerHTML = view.pages.map((p) => `
    <h4>Page ${p.page}</h4>
    <div class="side"><div><small>Original (stays here)</small><pre>${p.original}</pre></div>
    <div><small>Sent to LLM</small><pre>${p.sent_to_llm}</pre></div></div>`).join("");
}
</script>
</body>
</html>

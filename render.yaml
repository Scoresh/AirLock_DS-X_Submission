# Render blueprint: New + > Blueprint > pick this repo.
# The organizers' data is not in git. Add it in the service's Environment > Secret Files
# as NSSE-synthetic.csv (contents of data/NSSE-synthetic-render.csv, made by
# backend/scripts/make_render_data.py); Render mounts it at /etc/secrets/, where risk.py looks.
services:
  - type: web
    name: strangerthesis
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: NSSE_DATA_FILE
        value: /etc/secrets/NSSE-synthetic.csv

# Render blueprint: New + > Blueprint > pick this repo.
# The organizers' data is not in git. Add it in the service's Environment > Secret Files
# as NSSE-synthetic.csv (contents of data/NSSE-synthetic-render.txt (about 28 KB), made by
# backend/scripts/make_render_data.py); Render mounts it at /etc/secrets/, where risk.py looks.
services:
  - type: web
    name: airlock
    runtime: python
    plan: free
    buildCommand: bash backend/scripts/render-build.sh
    startCommand: python backend/scripts/run_jiff_demo.py --hosted-demo --host 0.0.0.0
    healthCheckPath: /status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: NSSE_DATA_FILE
        value: /etc/secrets/NSSE-synthetic.csv
